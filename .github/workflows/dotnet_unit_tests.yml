# This workflow builds the solution and runs the unit tests under /Tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Run Unit Tests

on:
  push:
    branches: [ "main" ]   # runs on every push and merge to main
  workflow_dispatch:       # allow running manually from the Actions tab

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore KosmosERP.sln

    - name: Build
      run: dotnet build KosmosERP.sln --configuration Release --no-restore

    # Runs every test project in the solution — i.e. both projects under /Tests
    # (KosmosERP.Tests.Modules and KosmosERP.Tests.Shared).
    - name: Test
      run: dotnet test KosmosERP.sln --configuration Release --no-build --verbosity normal
