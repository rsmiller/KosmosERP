# Runs the UI's Playwright end-to-end tests (UI/e2e) against a production build
# of the Next.js app. The API is mocked in the browser, so no database or API
# container is needed. See UI/README.md "End-to-end tests".

name: UI E2E Tests

on:
  pull_request:
    paths:
      - "UI/**"
      - ".github/workflows/ui_e2e_tests.yml"
  push:
    branches: [ "main" ]
    paths:
      - "UI/**"
      - ".github/workflows/ui_e2e_tests.yml"
  workflow_dispatch:       # allow running manually from the Actions tab

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Same image as UI/docker-compose.e2e.yml. Keep the tag in sync with the
    # exact @playwright/test version in UI/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    defaults:
      run:
        working-directory: UI

    steps:
    - uses: actions/checkout@v4

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('UI/package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-

    - name: Install dependencies
      run: npm ci

    - name: Type-check e2e tests
      run: npm run test:e2e:typecheck

    - name: Run Playwright tests
      env:
        HOME: /root
      run: npx playwright test

    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: UI/playwright-report/
        retention-days: 14

    - name: Upload traces and screenshots
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: UI/test-results/
        retention-days: 14
