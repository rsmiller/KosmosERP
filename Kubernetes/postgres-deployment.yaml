apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kosmos-erp-postgres-pvc
  namespace: kosmos-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosmos-erp-postgres
  namespace: kosmos-demo
  labels:
    app: kosmos-erp-postgres
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kosmos-erp-postgres
  template:
    metadata:
      labels:
        app: kosmos-erp-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "kosmos_erp"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: kosmos-erp-postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kosmos-erp-postgres-secret
              key: password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: kosmos-erp-postgres-pvc
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: kosmos-erp-postgres-service
  namespace: kosmos-demo
  labels:
    app: kosmos-erp-postgres
spec:
  type: ClusterIP
  selector:
    app: kosmos-erp-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
